name: Release

# Cut a release by pushing a semver tag:
#   git tag v0.3.0 && git push origin v0.3.0
#
# This publishes matching versioned images, a Helm chart to gh-pages, and a
# GitHub Release containing the chart archive. DMTCP explicitly consumes the
# agent image built in the same release rather than an unrelated :dev image.

on:
  push:
    tags: ['v*']

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: go-agent
          push: true
          tags: |
            mycedrive/go-agent:${{ steps.ver.outputs.version }}
            mycedrive/go-agent:latest

  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: operator
          push: true
          tags: |
            mycedrive/operator:${{ steps.ver.outputs.version }}
            mycedrive/operator:latest

  dmtcp:
    needs: agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: dmtcp
          push: true
          build-args: |
            AGENT_IMAGE=mycedrive/go-agent:${{ steps.ver.outputs.version }}
          tags: |
            mycedrive/dmtcp:${{ steps.ver.outputs.version }}
            mycedrive/dmtcp:latest

  mosquitto-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v5
        with:
          context: examples/mosquitto_d
          push: true
          tags: |
            mycedrive/mosquitto:${{ steps.ver.outputs.version }}
            mycedrive/mosquitto:latest

  chart:
    runs-on: ubuntu-latest
    needs: [agent, operator, dmtcp, mosquitto-example]
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package chart at release version
        run: |
          mkdir -p .chart-output
          helm lint deployment/operator
          helm package deployment/operator \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination .chart-output

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repo index
        run: |
          cp .chart-output/*.tgz gh-pages/
          helm repo index gh-pages --url https://paulosouzajr.github.io/mycedrive-k8s --merge gh-pages/index.yaml

      - name: Push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "helm: release chart ${{ steps.ver.outputs.version }}"
          git push origin gh-pages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .chart-output/*.tgz
          generate_release_notes: true
